name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # ── Install Docker if not present ──
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker $USER
            fi

            # ── Ensure Docker is running ──
            sudo systemctl start docker

            # ── Clone or pull the repo ──
            APP_DIR=~/All_Video_downloader

            if [ -d "$APP_DIR/.git" ]; then
              echo "Pulling latest changes..."
              cd $APP_DIR
              git fetch --all
              git reset --hard origin/main
            else
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git $APP_DIR
              cd $APP_DIR
            fi

            # ── Create .env file from secrets ──
            echo "MYSQL_HOST=${{ secrets.MYSQL_HOST }}" > $APP_DIR/project/.env
            echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> $APP_DIR/project/.env
            echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> $APP_DIR/project/.env
            echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> $APP_DIR/project/.env
            echo "MYSQL_PORT=${{ secrets.MYSQL_PORT }}" >> $APP_DIR/project/.env

            # ── Verify .env is valid ──
            echo "=== .env contents (masked) ==="
            cat $APP_DIR/project/.env | sed 's/=.*/=***/'

            # ── Remove old volume on first deploy to avoid password mismatch ──
            cd $APP_DIR/project
            sudo docker compose down --remove-orphans --volumes

            # ── Build and start ──
            sudo docker compose up --build -d

            # ── Show running containers ──
            sudo docker compose ps

            # ── Cleanup old images ──
            sudo docker image prune -f

            echo "Deployment complete!"
